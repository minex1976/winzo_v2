<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMS Records — Winzo</title>
<style>
  :root{--bg:#120b20;--panel:#1e1530;--border:#3a2a55;--fg:#eee;--muted:#9c8fb5;--accent:#8b5cf6;--accent-hover:#7c3aed;--green:#10b981;--red:#ef4444;--amber:#f59e0b}
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:16px;min-height:100vh;line-height:1.5;-webkit-text-size-adjust:100%}
  .container{max-width:760px;margin:0 auto}
  h1{font-size:21px;margin:0 0 3px}
  h2{font-size:16px;margin:0 0 10px}
  .subtitle{color:var(--muted);font-size:13px;margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input[type=text],input[type=password],input[type=url]{width:100%;background:#0d0818;color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:11px 12px;font-size:14px;font-family:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .row>div{flex:1;min-width:170px}
  button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;transition:background .15s,transform .1s,opacity .1s}
  button:hover:not(:disabled){background:var(--accent-hover)}
  button:active:not(:disabled){transform:scale(0.96);opacity:.85}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.secondary{background:transparent;color:var(--fg);border:1px solid var(--border)}
  button.secondary:hover:not(:disabled){background:#2a1d3d}
  a.btn-link{display:inline-block;background:var(--green);color:#04231a;text-decoration:none;border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:600;transition:background .15s,transform .1s}
  a.btn-link:hover{background:#059669}
  a.btn-link:active{transform:scale(0.96)}
  .statusbar{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none;word-break:break-word}
  .statusbar.show{display:block}
  .statusbar.info{background:rgba(139,92,246,.15);color:#c4b5fd;border:1px solid rgba(139,92,246,.3)}
  .statusbar.error{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
  .statusbar.success{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}
  .empty{color:var(--muted);text-align:center;padding:36px 18px;font-size:14px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin:0;white-space:nowrap}
  .chk input{width:auto}

  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .stat{flex:1;min-width:110px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
  .stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .stat .v{font-size:17px;font-weight:700;margin-top:2px}

  .sms{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:10px}
  .sms-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
  .sms-from{font-weight:600;font-size:15px;color:#c4b5fd;word-break:break-word}
  .sms-amount{font-size:18px;font-weight:700;color:#6ee7b7;white-space:nowrap}
  .sms-amount.na{color:var(--muted);font-size:13px;font-weight:500}
  .sms-meta{font-size:12.5px;color:var(--muted);line-height:2}
  .sms-meta b{color:#d1c4e9;font-weight:500;display:inline-block;min-width:74px}
  .sms-ref{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0d0818;border:1px solid var(--border);padding:3px 9px;border-radius:6px;color:#fcd34d;cursor:pointer;font-size:13px;letter-spacing:.6px;display:inline-block}
  .sms-ref:hover{background:#1a1030}
  .sms-raw{margin-top:9px}
  .sms-raw summary{cursor:pointer;color:var(--muted);font-size:12px;outline:none}
  .sms-raw p{margin:8px 0 0;background:#0d0818;border:1px solid var(--border);border-radius:8px;padding:9px;white-space:pre-wrap;word-break:break-word;line-height:1.6;font-size:12px;color:#b8abc9}
  .footlink{text-align:center;margin:18px 0 6px}
  .footlink a{color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<div class="container">

  <h1>SMS Records</h1>
  <div class="subtitle">Live view of <code style="background:#0d0818;padding:2px 6px;border-radius:4px">incoming_sms</code> from Firebase Realtime Database</div>

  <!-- Open admin app -->
  <div class="card">
    <div class="row" style="align-items:center">
      <div style="flex:1">
        <label style="margin-bottom:2px">Admin Dashboard</label>
        <div style="font-size:12.5px;color:var(--muted)">Open the Winzo admin panel (approve / reject transactions).</div>
      </div>
      <div style="flex:0 0 auto">
        <a class="btn-link" href="https://minex1976.github.io/private/"
           target="_blank" rel="noopener noreferrer">Open Admin App ↗</a>
      </div>
    </div>
  </div>

  <!-- Config -->
  <div class="card">
    <h2>Database</h2>
    <div class="row">
      <div style="flex:1 1 100%">
        <label for="dbUrl">Firebase Realtime DB URL</label>
        <input id="dbUrl" type="url" value="https://render-e9e2d-default-rtdb.firebaseio.com"
               placeholder="https://your-project-default-rtdb.firebaseio.com" autocomplete="off" spellcheck="false">
      </div>
    </div>

    <div class="row" style="margin-top:12px">
      <div style="flex:2 1 220px">
        <label for="search">Filter by reference / name / text</label>
        <input id="search" type="text" placeholder="e.g. DJA5N697O1" autocomplete="off" spellcheck="false">
      </div>
      <div style="flex:1 1 120px">
        <label for="limit">Show latest</label>
        <input id="limit" type="text" value="200" placeholder="200">
      </div>
    </div>

    <div class="row" style="margin-top:12px">
      <div style="flex:0 0 auto"><button id="loadBtn">Load SMS</button></div>
      <div style="flex:0 0 auto"><button id="clearBtn" class="secondary">Clear</button></div>
      <label class="chk" style="margin-left:auto">
        <input type="checkbox" id="autoChk"> Auto-refresh (10s)
      </label>
    </div>
  </div>

  <div id="status" class="statusbar"></div>

  <div class="stats" id="stats" style="display:none">
    <div class="stat"><div class="k">Records</div><div class="v" id="statCount">0</div></div>
    <div class="stat"><div class="k">Total amount</div><div class="v" id="statSum" style="color:#6ee7b7">0.00</div></div>
    <div class="stat"><div class="k">Last received</div><div class="v" id="statLast" style="font-size:13px;font-weight:600">—</div></div>
  </div>

  <div id="list"></div>

  <div class="footlink">
    <a href="https://minex1976.github.io/private/" target="_blank" rel="noopener noreferrer">
      minex1976.github.io/private ↗
    </a>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  let smsTimer = null;
  let allItems = [];

  function showStatus(msg, kind){
    const s = $('status');
    s.textContent = msg;
    s.className = 'statusbar show ' + (kind || 'info');
    if(kind === 'success'){
      setTimeout(()=>{ if(s.textContent === msg) s.className = 'statusbar show info'; }, 3500);
    }
  }
  function hideStatus(){ $('status').className = 'statusbar'; $('status').textContent=''; }

  function normalizeUrl(u){
    u = String(u || '').trim().replace(/\/+$/, '');
    if(!u) return '';
    if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u;
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function stampToDate(v){
    let n = Number(v);
    if(!n || !isFinite(n)) return null;
    if(n < 1e12) n *= 1000;
    const d = new Date(n);
    return isNaN(d.getTime()) ? null : d;
  }

  function fmtMoney(n){
    const x = Number(n);
    if(!isFinite(x)) return '—';
    return x.toFixed(2);
  }

  function parseSms(text){
    const t = String(text == null ? '' : text).replace(/\s+/g,' ').trim();
    const out = { amount:null, from:null, reference:null, dateText:null };
    if(!t) return out;

    let m = t.match(/received\s+(?:ETB|Birr)\s*([\d,]+(?:\.\d+)?)/i)
         || t.match(/(?:ETB|Birr)\s*([\d,]+(?:\.\d+)?)/i);
    if(m) out.amount = m[1].replace(/,/g,'');

    m = t.match(/\bfrom\s+(.+?)\s*\(/)
     || t.match(/\bfrom\s+([A-Za-z][A-Za-z\s.'\-]{1,40}?)(?=\s+\d|\s+on\b|\s*$)/i);
    if(m) out.from = m[1].trim().replace(/[.,;:]+$/,'');

    m = t.match(/your\s+transaction\s+number\s+is\s*[:\-]?\s*([A-Za-z0-9]{6,})/i)
     || t.match(/\breference(?:\s*(?:number|code|no\.?))?\s*[:\-]?\s*([A-Za-z0-9]{6,})/i)
     || t.match(/\b(?:transaction\s+number|txn\s*(?:id|no\.?))\s*[:\-]?\s*([A-Za-z0-9]{6,})/i);
    if(m) out.reference = m[1].toUpperCase();

    m = t.match(/\bon\s+(\d{1,2}\/\d{1,2}\/\d{4}(?:\s+\d{1,2}:\d{2}(?::\d{2})?)?)/);
    if(m) out.dateText = m[1];

    return out;
  }

  async function loadSms(){
    const base = normalizeUrl($('dbUrl').value);
    if(!base){ showStatus('Enter the Firebase Realtime DB URL.','error'); return; }

    $('loadBtn').disabled = true;
    showStatus('Fetching SMS records…','info');

    try{
      const res = await fetch(base + '/incoming_sms.json', {cache:'no-store'});

      if(res.status === 401 || res.status === 403)
        throw new Error('permission-denied — check Firebase Realtime Database rules');
      if(res.status === 404)
        throw new Error('not-found — check the database URL');
      if(!res.ok)
        throw new Error('http-' + res.status);

      const data = await res.json();

      if(!data || typeof data !== 'object'){
        allItems = [];
        render();
        showStatus('No SMS records found at /incoming_sms.','info');
        return;
      }

      allItems = Object.keys(data).map(k => {
        const v = data[k];
        const rec = (v && typeof v === 'object') ? Object.assign({}, v) : { text: String(v == null ? '' : v) };
        rec._id = k;
        rec._ts = Number(rec.receivedStamp || rec.sentStamp || rec.timestamp || 0) || 0;
        return rec;
      });

      allItems.sort((a,b) => b._ts - a._ts);

      render();
      showStatus('Loaded ' + allItems.length + ' SMS record' + (allItems.length === 1 ? '' : 's') + '.', 'success');
    }catch(e){
      showStatus('SMS fetch failed: ' + (e.message || e), 'error');
    }finally{
      $('loadBtn').disabled = false;
    }
  }

  function getLimit(){
    const n = parseInt($('limit').value, 10);
    return (isFinite(n) && n > 0) ? n : 200;
  }

  function getFilter(){
    return $('search').value.trim().toLowerCase();
  }

  function render(){
    const list = $('list');
    list.replaceChildren();

    const q = getFilter();
    let items = allItems;

    if(q){
      items = items.filter(r => {
        const p = parseSms(r.text || '');
        return String(r.text || '').toLowerCase().includes(q)
            || (p.reference && p.reference.toLowerCase().includes(q))
            || (p.from && p.from.toLowerCase().includes(q));
      });
    }

    const limit = getLimit();
    const shown = items.slice(0, limit);

    let sum = 0;
    for(const r of items){
      const p = parseSms(r.text || '');
      const a = Number(p.amount);
      if(isFinite(a)) sum += a;
    }
    $('stats').style.display = items.length ? '' : 'none';
    $('statCount').textContent = items.length;
    $('statSum').textContent = fmtMoney(sum);
    const newest = items.length ? items[0] : null;
    const nd = newest ? stampToDate(newest._ts) : null;
    $('statLast').textContent = nd ? nd.toLocaleString() : '—';

    if(!shown.length){
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = allItems.length ? 'No records match your filter.' : 'No SMS records loaded. Tap “Load SMS”.';
      list.appendChild(d);
      return;
    }

    for(const rec of shown) list.appendChild(renderItem(rec));

    if(items.length > shown.length){
      const more = document.createElement('div');
      more.className = 'empty';
      more.style.padding = '14px';
      more.textContent = 'Showing latest ' + shown.length + ' of ' + items.length + ' records.';
      list.appendChild(more);
    }
  }

  function renderItem(raw){
    const text = raw.text || raw.message || raw.body || '';
    const p = parseSms(text);

    const fromName = p.from || raw.from || '—';
    const when = stampToDate(raw._ts);
    const timeText = when ? when.toLocaleString() : (p.dateText || '—');

    const box = document.createElement('div');
    box.className = 'sms';

    const head = document.createElement('div');
    head.className = 'sms-head';

    const left = document.createElement('div');
    const fromEl = document.createElement('div');
    fromEl.className = 'sms-from';
    fromEl.textContent = fromName;
    left.appendChild(fromEl);
    head.appendChild(left);

    const right = document.createElement('div');
    right.style.textAlign = 'right';
    const amtEl = document.createElement('div');
    if(p.amount){
      amtEl.className = 'sms-amount';
      amtEl.textContent = fmtMoney(p.amount) + ' Birr';
    }else{
      amtEl.className = 'sms-amount na';
      amtEl.textContent = 'amount not found';
    }
    right.appendChild(amtEl);
    head.appendChild(right);
    box.appendChild(head);

    const meta = document.createElement('div');
    meta.className = 'sms-meta';

    const rFrom = document.createElement('div');
    rFrom.innerHTML = '<b>From:</b> ';
    rFrom.appendChild(document.createTextNode(fromName));
    meta.appendChild(rFrom);

    const rTime = document.createElement('div');
    rTime.innerHTML = '<b>Time:</b> ';
    rTime.appendChild(document.createTextNode(timeText));
    meta.appendChild(rTime);

    const rAmt = document.createElement('div');
    rAmt.innerHTML = '<b>Amount:</b> ';
    rAmt.appendChild(document.createTextNode(p.amount ? fmtMoney(p.amount) + ' Birr' : '—'));
    meta.appendChild(rAmt);

    const rRef = document.createElement('div');
    rRef.innerHTML = '<b>Reference:</b> ';
    if(p.reference){
      const chip = document.createElement('span');
      chip.className = 'sms-ref';
      chip.textContent = p.reference;
      chip.title = 'Click to copy';
      chip.onclick = () => {
        const done = () => {
          const old = chip.textContent;
          chip.textContent = 'copied ✓';
          setTimeout(()=>{ chip.textContent = old; }, 1200);
        };
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(p.reference).then(done).catch(()=>{});
        }else{
          try{
            const ta = document.createElement('textarea');
            ta.value = p.reference;
            document.body.appendChild(ta); ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            done();
          }catch(_){}
        }
      };
      rRef.appendChild(chip);
    }else{
      rRef.appendChild(document.createTextNode('—'));
    }
    meta.appendChild(rRef);

    if(raw.from && String(raw.from) !== String(fromName)){
      const rSender = document.createElement('div');
      rSender.innerHTML = '<b>Sender ID:</b> ';
      rSender.appendChild(document.createTextNode(String(raw.from)));
      meta.appendChild(rSender);
    }

    box.appendChild(meta);

    if(text){
      const det = document.createElement('details');
      det.className = 'sms-raw';
      const sum = document.createElement('summary');
      sum.textContent = 'Raw message';
      const pre = document.createElement('p');
      pre.textContent = text;
      det.append(sum, pre);
      box.appendChild(det);
    }

    return box;
  }

  function clearAll(){
    allItems = [];
    $('list').replaceChildren();
    $('stats').style.display = 'none';
    hideStatus();
  }

  function startAuto(){
    stopAuto();
    if($('autoChk').checked) smsTimer = setInterval(loadSms, 10000);
  }
  function stopAuto(){
    if(smsTimer){ clearInterval(smsTimer); smsTimer = null; }
  }

  $('loadBtn').onclick = loadSms;
  $('clearBtn').onclick = clearAll;
  $('autoChk').onchange = () => {
    if($('autoChk').checked){ loadSms(); startAuto(); }
    else stopAuto();
  };

  let filterTimer = null;
  $('search').addEventListener('input', () => {
    clearTimeout(filterTimer);
    filterTimer = setTimeout(render, 180);
  });
  $('limit').addEventListener('input', () => {
    clearTimeout(filterTimer);
    filterTimer = setTimeout(render, 250);
  });

  $('dbUrl').addEventListener('keydown', e => { if(e.key === 'Enter') loadSms(); });

  document.addEventListener('visibilitychange', () => {
    if(document.hidden) stopAuto();
    else if($('autoChk').checked) startAuto();
  });

  loadSms();
})();
</script>
</body>
</html>
